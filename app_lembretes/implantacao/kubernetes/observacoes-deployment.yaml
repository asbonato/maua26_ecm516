apiVersion: apps/v1
kind: Deployment
metadata:
  name: observacoes-deployment
spec:
  replicas: 1
  selector: 
    matchLabels:
      app: observacoes
  template:
    metadata:
      labels:
        app: observacoes
    spec:
      containers:
        - name: observacoes
          image: asbonato/observacoes
          imagePullPolicy: Never
          resources:
            limits:
              memory: 256Mi
              cpu: 1 
---
apiVersion: v1
kind: Service
metadata:
  name: observacoes-service
spec:
  type: NodePort
  selector:
    app: observacoes
  ports:
    - name: observacoes
      protocol: TCP
      port: 5000
      targetPort: 5000 
---
apiVersion: v1
kind: Service
metadata:
  name: observacoes-clusterip-service
spec:
  selector:
    app: observacoes
  ports:
    - name: observacoes
      protocol: TCP
      port: 5000
      targetPort: 5000 